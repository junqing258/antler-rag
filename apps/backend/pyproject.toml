[project]
name = "antler-rag-admin"
version = "0.1.0"
description = "Single-container multi-tenant RAG administration service"
requires-python = ">=3.11,<3.15"
dependencies = [
  "chromadb>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-text-splitters>=0.3,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antler_rag"]
